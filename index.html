<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hierarquia - Guarda Municipal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-icon"><img src="./fotos/gcm.png" alt="logo" height="15%" width="15%"></div>
      <div>
        <h1>Guarda Municipal</h1>
        <span>Hierarquia & Efetivo</span>
      </div>
    </div>
    <button class="menu-btn" id="menuBtn">☰</button>
  </header>

  <main class="container">
    <section class="hero">
      <div>
        <span class="eyebrow">ORGANOGRAMA OFICIAL</span>
        <h2>Hierarquia da Corporação</h2>
        <p>Consulte patentes, cargos e integrantes da corporação.</p>
      </div>
      <div class="stats">
        <div class="stat"><strong id="totalMembers">0</strong><span>Integrantes</span></div>
        <div class="stat"><strong id="totalRanks">0</strong><span>Patentes</span></div>
      </div>
    </section>

    <section class="toolbar">
      <div class="search">
        <span>🔎</span>
        <input id="searchInput" type="text" placeholder="Pesquisar por nome ou patente...">
      </div>
      <select id="rankFilter">
        <option value="all">Todas as patentes</option>
      </select>
    </section>

    <section id="hierarchy" class="hierarchy"></section>

    <div id="emptyState" class="empty hidden">
      <div>🔎</div>
      <h3>Nenhum resultado encontrado</h3>
      <p>Tente pesquisar outro nome ou patente.</p>
    </div>
  </main>

  <footer>
    <span>Guarda Municipal • Sistema de Hierarquia</span>
    <span id="year"></span>
  </footer>

  <script src="script.js"></script>
</body>
</html>
